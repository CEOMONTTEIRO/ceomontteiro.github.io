name: Import portfolio source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Import reviewed portfolio source
        run: |
          test -f portfolio-source.tar.gz
          tar -xzf portfolio-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public scripts tests README.md package.json package-lock.json next.config.ts next-env.d.ts postcss.config.mjs tsconfig.json .gitignore
          git rm portfolio-source.tar.gz
          git commit -m "feat: original responsive portfolio with interactive 3D and scroll film"
          git push
